# Fly.io config. Change `app` to the name you pick in `fly launch`.
app = "weekship"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/weekship.db"
  # BASE_URL, STRIPE_*, RESEND_API_KEY, EMAIL_FROM and SUPPORT_EMAIL are set
  # with `fly secrets set` (see LAUNCH.md).

[mounts]
  source = "weekship_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The widget runs on your customers' sites, so keep one machine always on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
